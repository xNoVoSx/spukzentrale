; Spukzentrale – Licht-ESP (#1)
;
; Bauen & flashen per USB:   pio run -t upload
; Update per WLAN (OTA):     SPUK_LICHT_IP=<IP des Licht-ESP> pio run -e licht_ota -t upload
;                            (fish: env SPUK_LICHT_IP=... pio run -e licht_ota -t upload)
;
; Vorher include/config.example.h nach include/config.h kopieren und anpassen.

[platformio]
default_envs = licht

[env:licht]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
; 2 x 1,9 MB App (OTA bleibt möglich), kleines Dateisystem wird nicht gebraucht
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -I../common
    -DFW_VERSION=\"1.1.0\"
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    links2004/WebSockets@2.7.2

[env:licht_ota]
extends = env:licht
upload_protocol = espota
; IP-Adresse des Licht-ESP (steht im Seriellen Monitor und in der Oberfläche unter „Geräte“)
upload_port = ${sysenv.SPUK_LICHT_IP}
upload_flags =
    --auth=${sysenv.SPUK_OTA_PASSWORT}
