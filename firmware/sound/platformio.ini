; Spukzentrale – Sound-ESP (#2)
;
; Bauen & flashen per USB:   pio run -t upload
; Update per WLAN (OTA):     SPUK_SOUND_IP=<IP des Sound-ESP> SPUK_OTA_PASSWORT=<…> pio run -e sound_ota -t upload
;                            (fish: env SPUK_SOUND_IP=... SPUK_OTA_PASSWORT=... pio run -e sound_ota -t upload)
; Seriellen Monitor öffnen:   pio device monitor
;
; Vorher include/config.example.h nach include/config.h kopieren und anpassen.
; Die Effekt-Sounds lädt der ESP selbst vom Server (kein uploadfs nötig).

[platformio]
default_envs = sound

[env:sound]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
; 2 × 1,3 MB App (OTA) + 1,25 MB LittleFS für die Effekt-Sounds
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -I../common
    -DFW_VERSION=\"1.2.0\"
    -DCORE_DEBUG_LEVEL=1
    -DHELIX_LOGGING_ACTIVE=false
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    links2004/WebSockets@2.7.2
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4

[env:sound_ota]
extends = env:sound
upload_protocol = espota
; IP-Adresse des Sound-ESP (steht im Seriellen Monitor und in der Oberfläche unter „Geräte“)
upload_port = ${sysenv.SPUK_SOUND_IP}
upload_flags =
    --auth=${sysenv.SPUK_OTA_PASSWORT}
