[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Der TestClient schließt seine Event-Loop, bevor asyncio die Transporte beendeter
    # ffmpeg-Prozesse aufräumt ("Event loop is closed" beim Aufräumen) – nur im Test.
    ignore::pytest.PytestUnraisableExceptionWarning
